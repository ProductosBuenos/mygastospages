
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor Profesional de Gastos</title>
<style>
body{font-family:Segoe UI,Arial;margin:0;background:#f4f6f9}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}
input,select,button{padding:10px;margin:5px}
button{cursor:pointer}
.stats{display:flex;gap:15px;flex-wrap:wrap}
.stat{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #ddd}
canvas{background:white;border:1px solid #ddd}
</style>
</head>
<body>
<div class="container">

<h1>💰 Gestor Profesional de Gastos</h1>

<div class="card">
<input id="fecha" type="date">
<input id="motivo" placeholder="Motivo">
<select id="categoria">
<option>Alimentación</option>
<option>Transporte</option>
<option>Estudios</option>
<option>Servicios</option>
<option>Entretenimiento</option>
<option>Otros</option>
</select>
<input id="monto" type="number" step="0.01" placeholder="Monto S/">
<button onclick="agregar()">Agregar</button>
<button onclick="exportarCSV()">Exportar CSV</button>
</div>

<div class="stats">
<div class="card stat"><h3>Total Gastado</h3><h2 id="total">S/0</h2></div>
<div class="card stat"><h3>N° Gastos</h3><h2 id="cantidad">0</h2></div>
<div class="card stat"><h3>Mayor Categoría</h3><h2 id="mayor">-</h2></div>
</div>

<div class="card">
<h3>Resumen por Categoría</h3>
<canvas id="grafico" width="800" height="350"></canvas>
</div>

<div class="card">
<h3>Historial</h3>
<table>
<thead>
<tr><th>Fecha</th><th>Motivo</th><th>Categoría</th><th>Monto</th></tr>
</thead>
<tbody id="tabla"></tbody>
</table>
</div>

</div>

<script>
let gastos = JSON.parse(localStorage.getItem("gastos_pro") || "[]");

function guardar(){
 localStorage.setItem("gastos_pro",JSON.stringify(gastos));
}

function agregar(){
 let fecha=document.getElementById("fecha").value;
 let motivo=document.getElementById("motivo").value;
 let categoria=document.getElementById("categoria").value;
 let monto=parseFloat(document.getElementById("monto").value);

 if(!motivo || !monto){ alert("Complete los datos"); return; }

 gastos.push({fecha,motivo,categoria,monto});
 guardar();
 render();
}

function render(){
 let tabla=document.getElementById("tabla");
 tabla.innerHTML="";

 let total=0;
 let categorias={};

 gastos.forEach(g=>{
   total+=g.monto;
   categorias[g.categoria]=(categorias[g.categoria]||0)+g.monto;

   tabla.innerHTML += `<tr>
   <td>${g.fecha}</td>
   <td>${g.motivo}</td>
   <td>${g.categoria}</td>
   <td>S/ ${g.monto.toFixed(2)}</td>
   </tr>`;
 });

 document.getElementById("total").innerText="S/ "+total.toFixed(2);
 document.getElementById("cantidad").innerText=gastos.length;

 let mayor="-",max=0;
 for(let c in categorias){
   if(categorias[c]>max){max=categorias[c]; mayor=c;}
 }
 document.getElementById("mayor").innerText=mayor;

 dibujar(categorias);
}

function dibujar(data){
 const c=document.getElementById("grafico");
 const ctx=c.getContext("2d");
 ctx.clearRect(0,0,c.width,c.height);

 let valores=Object.values(data);
 let etiquetas=Object.keys(data);

 if(valores.length===0) return;

 let max=Math.max(...valores);
 let ancho=70;

 valores.forEach((v,i)=>{
   let h=(v/max)*250;
   let x=70+i*100;
   let y=300-h;

   ctx.strokeRect(x,y,ancho,h);
   ctx.fillText("S/"+v.toFixed(0),x,y-5);
   ctx.fillText(etiquetas[i],x,320);
 });
}

function exportarCSV(){
 let csv="Fecha,Motivo,Categoria,Monto\n";
 gastos.forEach(g=>{
  csv+=`${g.fecha},${g.motivo},${g.categoria},${g.monto}\n`;
 });

 let blob=new Blob([csv],{type:'text/csv'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download="gastos.csv";
 a.click();
}

render();
</script>
</body>
</html>
